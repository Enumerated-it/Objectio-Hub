name: check-secrets
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      EXCL: ":!src/data/servicesData.ts :!.github/workflows/check-secrets.yml :!.githooks/pre-commit"
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers .env reels interdits
        run: |
          HITS=$(git ls-files | grep -E '(^|/)\.env(\.local|\.prod|\.production)?$' || true)
          if [ -n "$HITS" ]; then echo "$HITS"; echo "::error::Fichier .env versionne"; exit 1; fi
          echo "OK"
      - name: Donnees strictement personnelles et cles API interdites partout
        run: |
          P='BK71155|05/04/1970|1970-04-05|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}'
          HITS=$(git grep -nIE "$P" -- . $EXCL || true)
          if [ -n "$HITS" ]; then echo "$HITS"; echo "::error::Donnee personnelle ou cle API detectee"; exit 1; fi
          echo "OK"
      - name: Coordonnees bancaires autorisees UNIQUEMENT dans src/data/servicesData.ts
        run: |
          P='MA[0-9]{2}[ ]?[0-9]{4}[ ]?[0-9]{4}[ ]?[0-9]{4}|4704161211026600|230[ ]?610[ ]?4704'
          HITS=$(git grep -nIE "$P" -- . $EXCL || true)
          if [ -n "$HITS" ]; then echo "$HITS"; echo "::error::RIB/IBAN en dur hors de LEGAL_IDENTITY.bank"; exit 1; fi
          echo "OK - source unique respectee"